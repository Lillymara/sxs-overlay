plugins { id 'com.android.application' }
android {
    namespace 'com.lmthings.sxsoverlay'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'com.lmthings.sxsoverlay'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.2.1' }
    // Release builds are signed with the same key as the earlier debug builds, so they install over them.
    lint { checkReleaseBuilds false }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
